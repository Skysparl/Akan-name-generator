<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Akan Name Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <h1>Akan Name Generator</h1>
    <p>Enter your birthday and find out your Akan name!</p>

    <form id="nameForm">
      <label for="day">Day:</label>
      <input type="number" id="day" placeholder="DD">

      <label for="month">Month:</label>
      <input type="number" id="month" placeholder="MM">

      <label for="year">Year:</label>
      <input type="number" id="year" placeholder="YYYY">

      <br><br>

      <label>Gender:</label>
      <input type="radio" name="gender" value="male" id="male">
      <label for="male">Male</label>

      <input type="radio" name="gender" value="female" id="female">
      <label for="female">Female</label>

      <br><br>

      <button type="submit">Get My Name</button>
    </form>

    <div id="result">
      <h2 id="resultText"></h2>
    </div>

    <h3>Akan Names Table</h3>
    <table>
      <tr>
        <th>Day</th>
        <th>Male Name</th>
        <th>Female Name</th>
      </tr>
      <tr><td>Sunday</td><td>Kwasi</td><td>Akosua</td></tr>
      <tr><td>Monday</td><td>Kwadwo</td><td>Adwoa</td></tr>
      <tr><td>Tuesday</td><td>Kwabena</td><td>Abenaa</td></tr>
      <tr><td>Wednesday</td><td>Kwaku</td><td>Akua</td></tr>
      <tr><td>Thursday</td><td>Yaw</td><td>Yaa</td></tr>
      <tr><td>Friday</td><td>Kofi</td><td>Afua</td></tr>
      <tr><td>Saturday</td><td>Kwame</td><td>Ama</td></tr>
    </table>

  </div>

  <script src="script.js"></script>
</body>
</html>
